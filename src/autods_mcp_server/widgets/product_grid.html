<!DOCTYPE html>
<!--
AutoDS product grid — MCP App served as ui://autods/product-grid with
mimeType "text/html;profile=mcp-app" (RD-92).

Renders the thumbnails of a result set the user is choosing from. Images are
fetched by the browser from the URLs the server put in structuredContent, so
this costs zero vision tokens however many products come back.

Read-only by construction: no tools/call, no ui/message, no state change of any
kind. RD-97 measured the direct tools/call path as invisible to the model — six
calls executed and the model afterwards insisted none had, and
ui/update-model-context returns an empty success while doing nothing — so a
widget that mutated anything from here would produce duplicate writes the
moment the user retried. If an action is ever added to this file it goes
through ui/message, never through tools/call.

Each cell is a link to that product's page in the AutoDS web app when the
server sent one (the `link` field of an item). That is still read-only: it
navigates the user's browser, it does not call anything. Opening it is a
three-step chain because no spike ever measured whether a host lets a widget
leave the frame — see openProduct() below.

Four protocol rules are load-bearing here, each of which failed silently in
RD-82 with no error and no log line:

  * ui/initialize first, and ui/notifications/initialized only AFTER its
    RESPONSE arrives. Sent early, claude.ai ignores every later notification,
    sizing included.
  * ui/notifications/size-changed, repeatedly, or the host leaves the frame at
    its 150px default and the grid reads as a blank region.
  * the approved CSP is at result.hostCapabilities.sandbox, not result.sandbox.
  * ui/message params.content must be an ARRAY (not used here; recorded so the
    next editor does not rediscover it).

How the payload reaches this document is the one link RD-82 and RD-97 never
measured — both probes rendered hard-coded URLs. So rather than guess a channel
name, findPayload() walks EVERY inbound message for an object tagged
kind: "autods.images/1", which the server mints. If the host uses a channel we
did not anticipate, the diagnostic below says so in words instead of rendering
an empty box, and the transcript names the method that carried the data.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoDS product grid</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --cell: #f6f7f9; --accent: #0f62fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8eaed; --muted: #9aa2ad;
      --line: #2a2e35; --cell: #1c1f25; --accent: #6ea8ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  #head h1 { font-size: 13px; font-weight: 600; margin: 0; }
  #count { color: var(--muted); font-size: 12px; }
  #note {
    margin: 0 0 10px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 6px; color: var(--muted); font-size: 12px;
  }
  #grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  }
  .cell { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--cell); }
  /* A linked cell is a link and has to look like one — the whole cell is the
     target, so nothing but the cursor and the hover border says so. */
  a.cell { display: block; color: inherit; text-decoration: none; cursor: pointer; }
  a.cell:hover { border-color: var(--accent); }
  a.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Shown only when the host refused to open a tab: the URL, selectable, so a
     blocked link degrades to something the user can still copy. */
  #blocked { margin: 10px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; user-select: text; }
  #blocked[hidden] { display: none; }
  .thumb {
    display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain;
    background: var(--cell); border: 0;
  }
  .ph {
    display: flex; align-items: center; justify-content: center;
    width: 100%; aspect-ratio: 1 / 1; color: var(--muted); font-size: 11px;
    text-align: center; padding: 6px;
  }
  /* The caption is deliberately NOT truncated. A supplier title is keyword-
     stuffed and the distinguishing words sit at the end, so an ellipsis takes
     away exactly what tells two similar products apart; the cost is that cells
     in a row stretch to the tallest title, which is the accepted trade.
     A two-line -webkit-line-clamp was tried first and is worth not bringing
     back: the clamp bounds the CONTENT box and lets the next line paint into
     the element's own bottom padding, so it rendered two ellipsised lines plus
     a sliced third one. */
  .label {
    padding: 6px 8px; font-size: 12px; line-height: 1.35;
    overflow-wrap: anywhere;
  }
  /* Until the payload arrives the frame is an empty box, which reads as a
     broken widget. One muted line says it is working; the diagnostic below
     replaces it only once the silence is long enough to be a real fault. */
  #wait { margin: 0; color: var(--muted); font-size: 12px; }
  #wait[hidden] { display: none; }
  #diag {
    margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  #diag[hidden] { display: none; }
</style>
</head>
<body>
<div id="head"><h1>Products</h1><span id="count"></span></div>
<p id="note" hidden></p>
<p id="wait">Loading products…</p>
<div id="grid"></div>
<p id="blocked" hidden></p>
<pre id="diag" hidden></pre>

<script>
(function () {
  "use strict";

  var PAYLOAD_KIND = "autods.images/1";
  var $ = function (id) { return document.getElementById(id); };
  var post = function (msg) { try { window.parent.postMessage(msg, "*"); } catch (_) {} };

  // Opening a product page is the one thing in this document that leaves the
  // frame, and nothing has ever measured whether a host allows it. RD-82
  // captured `openLinks` among hostCapabilities and never called it; RD-97
  // called tools and messages and never a link. So this is a chain, not a
  // choice, and every step is observable:
  //
  //   1. window.open — returns null (no throw, no log) when the host's iframe
  //      sandbox omits allow-popups, which is exactly the silent failure the
  //      rest of this file is written against.
  //   2. the host's own openLinks channel, if it advertised one. The method
  //      name here is a reading of the spec, not a measurement, so an error
  //      response — or no response at all — falls through rather than leaving a
  //      picture that does nothing when clicked.
  //   3. print the URL, selectable. A link the user can copy is a worse product
  //      than a link that opens, and a far better one than neither.
  var OPEN_LINK_METHOD = "ui/open-link";
  var OPEN_LINK_TIMEOUT_MS = 1500;
  var hostCapabilities = {};
  var pendingOpens = {};
  var nextRequestId = 2;

  var showBlockedLink = function (url) {
    var node = $("blocked");
    node.textContent = "This client would not open a new tab. The product page is: " + url;
    node.hidden = false;
    reportSize();
  };

  var openProduct = function (url) {
    var win = null;
    try { win = window.open(url, "_blank", "noopener"); } catch (_) {}
    if (win) return;
    if (hostCapabilities && hostCapabilities.openLinks) {
      var id = nextRequestId++;
      pendingOpens[id] = url;
      post({ jsonrpc: "2.0", id: id, method: OPEN_LINK_METHOD, params: { url: url } });
      // A host that ignores an unknown method answers nothing at all, so the
      // timeout is the only thing between that and a dead click.
      setTimeout(function () {
        if (pendingOpens[id]) { delete pendingOpens[id]; showBlockedLink(url); }
      }, OPEN_LINK_TIMEOUT_MS);
      return;
    }
    showBlockedLink(url);
  };

  // The host sizes the frame from what the app reports and defaults to ~150px
  // otherwise, which reads as a blank region rather than as a failure. Measured
  // at max-content so the reported height is the height the content wants.
  var reportSize = function () {
    var root = document.documentElement;
    var prev = root.style.height;
    root.style.height = "max-content";
    var height = Math.ceil(root.getBoundingClientRect().height);
    root.style.height = prev;
    post({
      jsonrpc: "2.0", method: "ui/notifications/size-changed",
      params: { width: Math.ceil(window.innerWidth), height: height }
    });
  };

  // The diagnostic is a report about silence, so it is armed as an IDLE timer —
  // restarted by every host message — and it is retractable. A fixed timer from
  // load fires while the tool call itself is still running (the host sends
  // tool-input-partial before the tool is even called), and a diagnostic that
  // cannot be taken back then sits under a grid that rendered perfectly a moment
  // later. Both halves are needed: the idle timer stops it appearing on a slow
  // call, and clearDiagnostic() removes it if the payload arrives even so.
  //
  // A minute of host silence, because this box is for a BROKEN channel, and a
  // user waiting through a slow search must never see it. Twenty seconds was
  // still short enough to flash up on a normal search; the quiet "Loading"
  // line is what covers that wait instead.
  var DIAG_IDLE_MS = 60000;
  var diagTimer = null;
  var seenMethods = [];

  var clearDiagnostic = function () {
    if (diagTimer !== null) { clearTimeout(diagTimer); diagTimer = null; }
    var node = $("diag");
    if (node.hidden) return false;
    node.textContent = "";
    node.hidden = true;
    return true;
  };

  var showDiagnostic = function () {
    if (rendered) return;
    $("wait").hidden = true;
    var node = $("diag");
    node.hidden = false;
    node.textContent =
      "No product payload reached this widget.\n" +
      "Expected an object tagged kind=\"" + PAYLOAD_KIND + "\" in a host message.\n" +
      "Host methods seen: " + (seenMethods.join(", ") || "(none)") + "\n" +
      "The image URLs are still in this tool result's structuredContent.\n";
    reportSize();
  };

  var armDiagnostic = function () {
    if (rendered) return;
    if (diagTimer !== null) clearTimeout(diagTimer);
    diagTimer = setTimeout(showDiagnostic, DIAG_IDLE_MS);
  };

  // The payload's location in the host's message is not specified by anything
  // we have measured, so find it by shape: the first object anywhere in the
  // message tagged with our own kind marker. Bounded depth so a cyclic or huge
  // host payload cannot spin here.
  var findPayload = function (node, depth) {
    if (!node || typeof node !== "object" || depth > 8) return null;
    if (node.kind === PAYLOAD_KIND && Array.isArray(node.items)) return node;
    var keys = Array.isArray(node) ? node : Object.keys(node);
    for (var i = 0; i < keys.length; i++) {
      var child = Array.isArray(node) ? keys[i] : node[keys[i]];
      var hit = findPayload(child, depth + 1);
      if (hit) return hit;
    }
    return null;
  };

  var rendered = false;

  var render = function (payload) {
    if (rendered) return;
    rendered = true;
    clearDiagnostic();
    $("wait").hidden = true;

    var items = payload.items || [];
    var total = typeof payload.total === "number" ? payload.total : items.length;
    $("count").textContent = items.length === total
      ? String(total) + (total === 1 ? " product" : " products")
      : String(items.length) + " of " + total + " products";

    if (payload.note) {
      $("note").textContent = payload.note;
      $("note").hidden = false;
    }

    var grid = $("grid");
    items.forEach(function (item) {
      // A real anchor even though the click is handled in JS: the href is what
      // gives hover preview, copy-link and a modifier-click their meaning, and
      // those are handled by the browser rather than by the chain below.
      var cell;
      if (item.link) {
        cell = document.createElement("a");
        cell.href = item.link;
        cell.target = "_blank";
        cell.rel = "noopener noreferrer";
        cell.addEventListener("click", function (event) {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
          event.preventDefault();
          openProduct(item.link);
        });
      } else {
        cell = document.createElement("div");
      }
      cell.className = "cell";

      var first = (item.images || [])[0];
      if (first && first.url) {
        var img = document.createElement("img");
        img.className = "thumb";
        // Bandwidth, not tokens: a 900KB original in a 120px cell is fine, but
        // 20 of them are not, so nothing loads until it scrolls into view.
        img.loading = "lazy";
        img.decoding = "async";
        img.alt = item.label || "";
        // A host outside the declared CSP allowlist, an expired signed URL, a
        // WAF-hostile host: all of them arrive here as an error event, and all
        // of them must degrade to "no image", never to a full-size retry.
        img.onerror = function () {
          var ph = document.createElement("div");
          ph.className = "ph";
          ph.textContent = "image unavailable";
          if (img.parentNode) img.parentNode.replaceChild(ph, img);
          reportSize();
        };
        img.onload = reportSize;
        img.src = first.url;
        cell.appendChild(img);
      } else {
        var empty = document.createElement("div");
        empty.className = "ph";
        empty.textContent = "no image";
        cell.appendChild(empty);
      }

      if (item.label) {
        var label = document.createElement("div");
        label.className = "label";
        label.textContent = item.label;
        cell.appendChild(label);
      }
      grid.appendChild(cell);
    });

    if (!items.length) {
      var none = document.createElement("div");
      none.className = "ph";
      none.textContent = "no products in this result";
      grid.appendChild(none);
    }
    reportSize();
  };

  var initDone = false;

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;

    if (data.method && seenMethods.indexOf(data.method) === -1) seenMethods.push(data.method);
    if (data.method === "ui/notifications/host-context-changed") reportSize();
    // The host is talking, so whatever it is about to send has not stopped
    // coming. Restart the countdown.
    armDiagnostic();

    // A reply to our own open-link request. An error means the host does not
    // know that method, which is a fall-through and not a failure to report.
    if (data.id !== undefined && pendingOpens[data.id]) {
      var url = pendingOpens[data.id];
      delete pendingOpens[data.id];
      if (data.error) showBlockedLink(url);
      return;
    }

    var payload = findPayload(data, 0);
    if (payload) render(payload);

    var result = data.result;
    if (result && !initDone) {
      initDone = true;
      // What the host says it can do. Only openLinks is read today, and it is
      // read as a hint: RD-97 watched advertised capabilities behave two
      // different ways — serverTools was advertised while tools/list answered
      // "method not found", and updateModelContext is advertised and is a
      // silent no-op. So this steers the chain; it never proves it worked.
      hostCapabilities = result.hostCapabilities || {};
      // Only now: announcing initialized before the response lands makes
      // claude.ai ignore every later notification, sizing included.
      post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
      reportSize();
      setTimeout(reportSize, 250);
    }
  });

  post({
    jsonrpc: "2.0", id: 1, method: "ui/initialize",
    params: {
      appInfo: { name: "autods-product-grid", version: "1.0.0" },
      appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      protocolVersion: "2025-11-21"
    }
  });

  reportSize();
  window.addEventListener("load", reportSize);
  window.addEventListener("resize", reportSize);

  // If nothing tagged with our marker arrives, say which methods the host DID
  // send. An empty grid with no explanation is the failure mode this whole
  // ticket is about; naming the channel turns a silent blank into a one-line
  // bug report.
  armDiagnostic();
})();
</script>
</body>
</html>
