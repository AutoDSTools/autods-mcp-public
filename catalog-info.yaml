---
# =============================================================================
# autods-mcp-public — one Component, plus the one third-party API it calls.
#
# Backstage is the org's software catalog and developer portal, at
# https://backstage.autods.com. It builds this service's entity page — owner,
# links, Kubernetes tab, and every edge to the services and infrastructure it
# reaches — from this file and nothing else.
#
# Conventions: AutoDSTools/backstage → CONVENTIONS.md; every `§` below points
# there.
#
#     https://github.com/AutoDSTools/backstage/blob/main/CONVENTIONS.md
#
# NAME MAPPING (§ 2) — four names for one service, none of them typos:
#
#     entity           autods-mcp-public
#     repository       AutoDSTools/autods-mcp-public
#     helm chart       autods-mcp, in AutoDSTools/autods-mcp-deploy
#     Sentry project   autods-mcp-public
#
# The chart, pipeline and nginx image live in AutoDSTools/autods-mcp-deploy.
# This file stays here: the entity describes the server's code, and that
# repository holds only the way it is deployed (§ 1).
#
# NO SYSTEM — one deployable and no store of its own (§ 4).
#
# NO API ENTITY FOR THE MCP SURFACE — a deviation, not a rule of the
# conventions. This repository owns the entry point, but its callers are MCP
# client applications on end users' own machines, so `consumesApis` pointing at
# it would stay empty: the entity would be a node with no edge. Declare it the
# day a catalogued consumer appears — an AutoDS service or frontend calling
# this server. The protocol surface is documented in this repository's README.
#
# NO VENDOR API ENTITY FOR THE PRODUCT-IMAGE FETCH. The server fetches product
# images itself, with no credential, from an allowlist of supplier CDN host
# families kept in its own code. There is no vendor product to describe: one
# entity per host family would describe "an image, by URL" over and over, and
# go stale the first time a supplier changes CDN. The Mixpanel entity below is
# the contrast — one vendor, an account and an SDK. Revisit if the server ever
# calls a vendor's real API, such as an image-resizing or image-analysis
# product (§ 2).
# =============================================================================
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: autods-mcp-public
  description: >-
    Public MCP server. Exposes a curated, hand-maintained set of AutoDS platform
    and product-research operations to MCP client applications (Claude, Cursor)
    over a Streamable HTTP transport, as an OAuth resource server in front of the
    platform identity provider. It holds no credentials of its own: every
    upstream call carries the caller's own token, so a caller reaches exactly
    what they could reach directly.
  annotations:
    github.com/project-slug: AutoDSTools/autods-mcp-public
    # `master`, not the default branch: this repository's trunk is `develop`,
    # which discovery never reads (§ 10). Do not "correct" it to the default
    # branch.
    backstage.io/source-location: url:https://github.com/AutoDSTools/autods-mcp-public/tree/master/
    sentry.io/project-slug: autods-mcp-public
    # Both values are resolved against the chart in AutoDSTools/autods-mcp-deploy,
    # which nobody editing this repository sees; the id is the chart name, not
    # the entity name. A rename or relabel there empties the Kubernetes tab with
    # nothing here changing and nothing reporting it.
    backstage.io/kubernetes-namespace: prod
    backstage.io/kubernetes-id: autods-mcp
  links:
    - url: https://github.com/AutoDSTools/autods-mcp-public
      title: Source (GitHub)
      icon: github
    - url: https://github.com/AutoDSTools/autods-mcp-deploy
      title: Helm chart, pipeline and nginx image (GitHub)
      icon: github
    - url: https://sentry.autods.com/organizations/autods/projects/autods-mcp-public/
      title: Sentry (autods-mcp-public)
      icon: dashboard
  tags:
    - python
    - mcp
    - api
    - oauth
spec:
  type: service
  lifecycle: production
  owner: squad-cto-office

  consumesApis:
    - autods-platform-rest
    # Reached through the API gateway, so these are its route-group APIs, not
    # the upstreams' own (§ 14).
    - autods-gateway-products-research-rest
    - autods-gateway-scrapers-api-rest
    # Declared at the bottom of this file (§ 2).
    - autods-mcp-public-mixpanel-api

  dependsOn:
    - component:default/autods-api
    # Shared platform infrastructure owned by devops, declared in
    # https://github.com/AutoDSTools/backstage/blob/main/catalog/shared-infrastructure.yaml.
    # No Resource of this service's own for either: it validates tokens against
    # the same identity provider as the rest of the platform, and it holds a
    # logical database on a Redis cluster that other services also use — a
    # keyspace inside someone else's Resource (§ 3).
    - resource:default/aws-cognito
    - resource:default/redis-platform

# =============================================================================
# THIRD-PARTY APIs CONSUMED BY THIS SERVICE (§ 1, § 2, § 8)
#
# Self-hosted Sentry is deliberately NOT one of these: it is our own
# infrastructure rather than a vendor product we integrate with, and the
# annotation and link on the Component above are the whole of what the catalog
# says about it.
# =============================================================================
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: autods-mcp-public-mixpanel-api
  description: >-
    Mixpanel ingestion, through the vendor's Python SDK. Product analytics for
    this server's own usage: one event per tool call, attributed to the calling
    AutoDS user. Fire-and-forget — an event is dropped rather than allowed to
    delay or fail a call, and nothing here reads back from Mixpanel.
  links:
    - title: HTTP API reference
      url: https://developer.mixpanel.com/reference/ingestion-api
  tags: [external, analytics, mixpanel]
spec:
  type: openapi
  lifecycle: production
  owner: squad-cto-office
  definition: |
    openapi: 3.0.0
    info:
      title: Mixpanel Ingestion API
      version: external
      description: External API by Mixpanel. See metadata.links for the real spec.
    paths: {}
