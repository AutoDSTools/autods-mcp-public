<!DOCTYPE html>
<!--
AutoDS product card — MCP App served as ui://autods/product-card with
mimeType "text/html;profile=mcp-app" (RD-92).

One product, its hero image and the rest of its gallery as thumbnails that swap
the hero on click. Same contract as product_grid.html: the browser fetches the
images from the URLs in structuredContent (zero vision tokens), the document is
self-contained with no build step, and it is read-only — no tools/call and no
ui/message, so nothing here can mutate state or produce a duplicate write.

The four load-bearing protocol rules and the reason findPayload() searches by
shape rather than by channel name are documented at the top of
product_grid.html; both files obey the same ones.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoDS product card</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --cell: #f6f7f9; --accent: #0f62fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8eaed; --muted: #9aa2ad;
      --line: #2a2e35; --cell: #1c1f25; --accent: #6ea8ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 10px; line-height: 1.35; }
  #hero-wrap {
    border: 1px solid var(--line); border-radius: 8px; background: var(--cell);
    overflow: hidden; max-width: 420px;
  }
  #hero { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: var(--cell); }
  .ph {
    display: flex; align-items: center; justify-content: center;
    width: 100%; aspect-ratio: 1 / 1; color: var(--muted); font-size: 12px;
  }
  #strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-width: 420px; }
  #strip button {
    padding: 0; width: 56px; height: 56px; border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; background: var(--cell); cursor: pointer;
  }
  #strip button[aria-current="true"] { border-color: var(--accent); border-width: 2px; }
  #strip img { display: block; width: 100%; height: 100%; object-fit: contain; }
  #note { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  #note[hidden], #strip[hidden] { display: none; }
  /* The hero picture is the link when the server sent one, and the title is
     not: a linked title cannot be dragged over and copied, and the title is
     what people copy. Browsing the gallery is the strip below, never the hero,
     so nothing competes for the click. */
  a.shot { display: block; cursor: pointer; }
  a.shot:hover, a.shot:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #blocked { margin: 10px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; user-select: text; }
  #blocked[hidden] { display: none; }
  /* Until the payload arrives the frame is an empty box, which reads as a
     broken widget. See product_grid.html for why this covers the wait and the
     diagnostic no longer does. */
  #wait { margin: 0; color: var(--muted); font-size: 12px; }
  #wait[hidden] { display: none; }
  #diag {
    margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  #diag[hidden] { display: none; }
</style>
</head>
<body>
<h1 id="title">Product</h1>
<p id="wait">Loading product…</p>
<div id="hero-wrap"></div>
<div id="strip" hidden></div>
<p id="note" hidden></p>
<p id="blocked" hidden></p>
<pre id="diag" hidden></pre>

<script>
(function () {
  "use strict";

  var PAYLOAD_KIND = "autods.images/1";
  var $ = function (id) { return document.getElementById(id); };
  var post = function (msg) { try { window.parent.postMessage(msg, "*"); } catch (_) {} };

  var reportSize = function () {
    var root = document.documentElement;
    var prev = root.style.height;
    root.style.height = "max-content";
    var height = Math.ceil(root.getBoundingClientRect().height);
    root.style.height = prev;
    post({
      jsonrpc: "2.0", method: "ui/notifications/size-changed",
      params: { width: Math.ceil(window.innerWidth), height: height }
    });
  };

  // Idle timer, and retractable — see the comment on the same block in
  // product_grid.html for why a fixed timer from load prints a diagnostic under
  // a card that renders correctly a moment later, and why the wait is a minute.
  var DIAG_IDLE_MS = 60000;
  var diagTimer = null;
  var seenMethods = [];

  var clearDiagnostic = function () {
    if (diagTimer !== null) { clearTimeout(diagTimer); diagTimer = null; }
    var node = $("diag");
    if (node.hidden) return false;
    node.textContent = "";
    node.hidden = true;
    return true;
  };

  var showDiagnostic = function () {
    if (rendered) return;
    $("wait").hidden = true;
    var node = $("diag");
    node.hidden = false;
    node.textContent =
      "No product payload reached this widget.\n" +
      "Expected an object tagged kind=\"" + PAYLOAD_KIND + "\" in a host message.\n" +
      "Host methods seen: " + (seenMethods.join(", ") || "(none)") + "\n" +
      "The image URLs are still in this tool result's structuredContent.\n";
    reportSize();
  };

  var armDiagnostic = function () {
    if (rendered) return;
    if (diagTimer !== null) clearTimeout(diagTimer);
    diagTimer = setTimeout(showDiagnostic, DIAG_IDLE_MS);
  };

  var findPayload = function (node, depth) {
    if (!node || typeof node !== "object" || depth > 8) return null;
    if (node.kind === PAYLOAD_KIND && Array.isArray(node.items)) return node;
    var keys = Array.isArray(node) ? node : Object.keys(node);
    for (var i = 0; i < keys.length; i++) {
      var child = Array.isArray(node) ? keys[i] : node[keys[i]];
      var hit = findPayload(child, depth + 1);
      if (hit) return hit;
    }
    return null;
  };

  // Opening the product's page. Same three-step chain as product_grid.html,
  // and the comment there explains why it is a chain: nothing has ever measured
  // whether a host lets a widget leave the frame, window.open returns null
  // without a word when the sandbox forbids it, and the openLinks method name
  // is a reading of the spec rather than a measurement. Duplicated rather than
  // shared because these assets have no build step.
  var OPEN_LINK_METHOD = "ui/open-link";
  var OPEN_LINK_TIMEOUT_MS = 1500;
  var hostCapabilities = {};
  var pendingOpens = {};
  var nextRequestId = 2;

  var showBlockedLink = function (url) {
    var node = $("blocked");
    // Conditional wording, for the reason product_grid.html explains: a host
    // that opens the link and answers nothing is indistinguishable from one
    // that refused.
    node.textContent = "If no new tab opened, the product page is: " + url;
    node.hidden = false;
    reportSize();
  };

  var openProduct = function (url) {
    var win = null;
    try { win = window.open(url, "_blank", "noopener"); } catch (_) {}
    if (win) return;
    if (hostCapabilities && hostCapabilities.openLinks) {
      var id = nextRequestId++;
      pendingOpens[id] = url;
      post({ jsonrpc: "2.0", id: id, method: OPEN_LINK_METHOD, params: { url: url } });
      setTimeout(function () {
        if (pendingOpens[id]) { delete pendingOpens[id]; showBlockedLink(url); }
      }, OPEN_LINK_TIMEOUT_MS);
      return;
    }
    showBlockedLink(url);
  };

  var placeholder = function (text) {
    var node = document.createElement("div");
    node.className = "ph";
    node.textContent = text;
    return node;
  };

  // Set from the payload before the first showHero, and read on every later
  // one: the strip re-runs showHero on each thumbnail click, so the anchor has
  // to be rebuilt rather than attached once.
  var productLink = null;

  // Puts the hero picture — or whichever placeholder stands in for it — into
  // the frame, inside an anchor when the server sent a link. Only the picture
  // is ever the link: an anchor around the title would make the title
  // unselectable, and copying the title is the common thing to want here.
  var mountHero = function (node) {
    var wrap = $("hero-wrap");
    wrap.textContent = "";
    if (!productLink) {
      wrap.appendChild(node);
      return;
    }
    var anchor = document.createElement("a");
    anchor.className = "shot";
    anchor.href = productLink;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    anchor.addEventListener("click", function (event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
      event.preventDefault();
      openProduct(productLink);
    });
    anchor.appendChild(node);
    wrap.appendChild(anchor);
  };

  var showHero = function (url, alt) {
    if (!url) {
      mountHero(placeholder("no image"));
      reportSize();
      return;
    }
    var img = document.createElement("img");
    img.id = "hero";
    img.decoding = "async";
    img.alt = alt || "";
    img.onerror = function () {
      mountHero(placeholder("image unavailable"));
      reportSize();
    };
    img.onload = reportSize;
    img.src = url;
    mountHero(img);
  };

  var rendered = false;

  var render = function (payload) {
    if (rendered) return;
    rendered = true;
    clearDiagnostic();
    $("wait").hidden = true;

    // A card renders one item; a payload carrying several (a by-id read that
    // returned a list) shows the first and says so rather than dropping the
    // rest without a word.
    var item = (payload.items || [])[0] || { images: [] };
    var images = item.images || [];
    if (item.label) $("title").textContent = item.label;

    // Before the first showHero, so the hero is built as an anchor straight
    // away. The title stays plain text on purpose — see the CSS above.
    productLink = item.link || null;
    showHero(images.length ? images[0].url : null, item.label);

    if (images.length > 1) {
      var strip = $("strip");
      strip.hidden = false;
      images.forEach(function (image, index) {
        var button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-current", index === 0 ? "true" : "false");
        button.title = "Image " + (index + 1) + " of " + images.length;
        var thumb = document.createElement("img");
        thumb.loading = "lazy";
        thumb.decoding = "async";
        thumb.alt = "";
        thumb.onerror = function () { button.disabled = true; button.textContent = "×"; };
        thumb.src = image.url;
        button.appendChild(thumb);
        button.addEventListener("click", function () {
          Array.prototype.forEach.call(strip.children, function (other) {
            other.setAttribute("aria-current", "false");
          });
          button.setAttribute("aria-current", "true");
          showHero(image.url, item.label);
        });
        strip.appendChild(button);
      });
    }

    var notes = [];
    if (payload.note) notes.push(payload.note);
    if ((payload.items || []).length > 1) {
      notes.push("Showing the first of " + payload.items.length + " products in this result.");
    }
    if (notes.length) {
      $("note").textContent = notes.join(" ");
      $("note").hidden = false;
    }
    reportSize();
  };

  var initDone = false;

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;

    if (data.method && seenMethods.indexOf(data.method) === -1) seenMethods.push(data.method);
    if (data.method === "ui/notifications/host-context-changed") reportSize();
    armDiagnostic();

    var payload = findPayload(data, 0);
    if (payload) render(payload);

    // A reply to our own open-link request; an error means the host does not
    // know that method, which is a fall-through and not something to report.
    if (data.id !== undefined && pendingOpens[data.id]) {
      var openedUrl = pendingOpens[data.id];
      delete pendingOpens[data.id];
      if (data.error) showBlockedLink(openedUrl);
      return;
    }

    var result = data.result;
    if (result && !initDone) {
      initDone = true;
      hostCapabilities = result.hostCapabilities || {};
      post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
      reportSize();
      setTimeout(reportSize, 250);
    }
  });

  post({
    jsonrpc: "2.0", id: 1, method: "ui/initialize",
    params: {
      appInfo: { name: "autods-product-card", version: "1.0.0" },
      appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      protocolVersion: "2025-11-21"
    }
  });

  reportSize();
  window.addEventListener("load", reportSize);
  window.addEventListener("resize", reportSize);

  armDiagnostic();
})();
</script>
</body>
</html>
